  consistencia_min: 0.80  # Mantener reglas y líneas entre ejecuciones.
  latencia_p95_ms_max: 12000  # Espera objetivo para una revisión corta.
  costo_promedio_usd_max: 0.01  # Presupuesto de generación por revisión; embeddings aparte.
